name: Validate portal
on:
  pull_request:
  push:
    branches: [feat/unified-starlight-portal, 'fix/**', main]
permissions:
  contents: read
jobs:
  validate:
    # Keep the OS stable when GitHub changes the ubuntu-latest label.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation
          path: |
            migration/validation.json
            playwright-report/
  pipeline:
    # Pipeline académico: tests rápidos (sin Docling ni modelos), verificación
    # simbólica de los ejercicios publicados y control de calidad del contenido.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/content-pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/content-pipeline/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -m "not integration"
      - run: content-pipeline verify-math --subject algebra-ii
      - run: content-pipeline qa --subject algebra-ii --report "$RUNNER_TEMP/content-qa.json"
