[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "content-pipeline"
version = "0.1.0"
description = "Pipeline local para procesar material académico con Docling y preparar contexto trazable para generar apuntes."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "PyYAML>=6.0",
  "sympy>=1.12",
]

[project.optional-dependencies]
# Motor de extracción. Pesado (PyTorch y modelos): no se instala en CI.
extract = ["docling>=2.40"]
# Transcripción de clases grabadas mediante el pipeline ASR de Docling.
asr = ["docling[asr]>=2.40", "imageio-ffmpeg>=0.5"]
dev = ["pytest>=8.0"]

[project.scripts]
content-pipeline = "content_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/content_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requiere Docling y sus modelos (se omite si no está instalado)",
]
