# Reglas de clasificación de las fuentes de Bases de Datos Aplicada (3641).
# `match` usa comodines sobre la ruta relativa a raw/, sin distinguir mayúsculas ni acentos;
# `*` también cruza carpetas. Las reglas se aplican en orden: las posteriores pisan a las anteriores.
#
# Las reglas por archivo reflejan el CONTENIDO verificado en la auditoría de 2026-11-17
# (portadas, pies, consignas), no el nombre ni la carpeta: varios archivos están mal rotulados
# (ver `notes`). Ningún patrón usa corchetes porque fnmatch los interpreta como clases.
#
# Licencias (ninguna fuente local se redistribuye; el catálogo solo registra procedencia):
#   privado-catedra  material de la cátedra distribuido por MIeL/Teams a los cursantes.
#   privado-alumno   material de estudiantes (resúmenes, resoluciones, exámenes reconstruidos).
# No se registran nombres de estudiantes: la autoría consta en cada documento.
#
# Los .txt (formato plaintext) se leen sin Docling y sus enlaces nunca se siguen.
id: bbdd-aplicadas
id_prefix: bbdd-aplicadas
name: Bases de Datos Aplicada
code: "3641"
program: Programa Analitico.pdf

defaults:
  license: privado-catedra
  distribution: privado
  # Materia de SQL y MQL, sin notación matemática: OCR y tablas, sin el modelo de fórmulas.
  # picture_text: exporta el texto de capturas (código, Compass, formularios), que es contenido.
  extraction: {profile: text, picture_text: true}

rules:
  # ---------------------------------------------------------------------------------------------
  # Documentos de la materia
  - match: "programa analitico.pdf"
    doc_type: programa
    source: Cátedra BDA (UNLaM), firmado por J. Hnatiuk el 07/08/2024
    version: "2024"
    units: [u1, u2, u3, u4, u5, u6]
  - match: "presentacion y cronograma.pdf"
    doc_type: cronograma
    source: Cátedra BDA (UNLaM), presentación de la materia
    version: "v1.32 (2025-08)"
    units: [u1, u2, u3, u4, u5, u6]
    notes: "Normas de cursada y evaluación; el cronograma (p. 17) es una imagen."

  # ---------------------------------------------------------------------------------------------
  # Material de cátedra: presentaciones de clase, guías e instructivos.
  - match: "material teorico/*"
    doc_type: teoria-catedra
    source: Cátedra BDA (UNLaM)
  - match: "material teorico/*/*guia*"
    doc_type: guia-practica
  - match: "material teorico/unidad 1*"
    units: [u1]
  - match: "material teorico/unidad 2*"
    units: [u2]
  - match: "material teorico/unidad 3*"
    units: [u3]
  - match: "material teorico/unidad 4*"
    units: [u4]
  - match: "material teorico/unidad 5*"
    units: [u5]

  - match: "material teorico/unidad 1*/1. unidad 1 - parte 1.pdf"
    version: "v1.1.0 (2025-03)"
  - match: "material teorico/unidad 1*/2. unidad 1 - parte 2.pdf"
    version: "v1.0.3 (2024-08)"
    notes: "Repaso SQL completo (DDL/DML a pivot). El pie dice 'parte 1 V1.1'."
  - match: "material teorico/unidad 1*/3. window functions.pdf"
    version: "v1.0 (2024-03)"
  - match: "material teorico/unidad 1*/guia de ejercicios - windows functions.pdf"
    version: "v1.0 (2024-03)"
    notes: "Nueve ejercicios con script de carga; el resultado esperado es una imagen. Resolución de alumno: Ejercicios Resueltos/Z/RESOLUCION WF.pdf."
  - match: "material teorico/unidad 1*/guia de ejercicios.pdf"
    version: "2024-03"
    notes: "TP 1, Repaso de SQL (20 consignas, sin resolución)."
  - match: "material teorico/unidad 2*/unidad-2-guia-ejercicios.pdf"
    units: [u1, u2]
    version: "2024-04"
    notes: "TP 2: collation, importación CSV, temporales globales; también percentiles y CTE (u1). Sin resolución."
  - match: "material teorico/unidad 2*/unidad-2-parte-1.pdf"
    units: [u2, u4]
    version: "V1.0.1 (2024)"
    notes: "Las pp. 12-15 tratan DWH y Data Lake, que el programa 2024 ubica en u4."
  - match: "material teorico/unidad 2*/unidad-2-parte-2.pdf"
    version: "v1.0 (2024-04)"
    notes: "Formatos de intercambio y APIs. El título de metadatos ('Unidad 1 - parte 3') es residuo de plantilla."
  - match: "material teorico/unidad 3*/unidad-3---parte-1_2.pdf"
    version: "v1.0 (2023-08)"
    notes: "Plan de ejecución, índices, estadísticas, optimización, rowstore/columnstore."
  - match: "material teorico/unidad 3*/unidad-3---parte-2.pdf"
    version: "v1.0 (2023-08)"
    notes: "TCL, concurrencia, bloqueos, distribuidas, monitoreo. Portada 'parte 3', pie 'Unidad 1 - parte 3', metadatos 'Unidad 1 - Parte 1'."
  - match: "material teorico/unidad 4*/1. mongodb.pdf"
    version: "V2.0 (2025)"
    notes: "Parte 1: introducción, CRUD, find, Compass, Atlas."
  - match: "material teorico/unidad 4*/2. mongodb.pdf"
    version: "v3.0 (2025)"
    notes: "Parte 2: agregaciones y vistas. Existe una edición posterior (v3.0 2026) publicada en public/bbdd-aplicadas/unidad-4/inputs/MongoDB-Agregaciones-2026.pdf, fuera de raw/."
  - match: "material teorico/unidad 4*/3. mongodb.pdf"
    version: "v1.0 (2024)"
    notes: "Parte 3: índices. Idéntico (mismo SHA-256) a public/bbdd-aplicadas/unidad-4/inputs/MongoDB-Indices.pdf, que ya se publica."
  - match: "material teorico/unidad 4*/4. mongodb.pdf"
    version: "2023-07"
    notes: "No trata MongoDB: apunte teórico NoSQL (ACID, BASE, CAP, modelos clave-valor, documentos, grafos, columnas)."
  - match: "material teorico/unidad 4*/guia  de ejercicio 2.pdf"
    version: "2C2025, com. 02-5600"
    notes: "TP MongoDB sobre datosventas (25 consignas, sin resolución). Resolución de alumno: Ejercicios Resueltos/Z/RESOLUCION MONGO.pdf. Toca de pasada usuarios de solo lectura (u5)."
  - match: "material teorico/unidad 4*/guia de ejercicios.pdf"
    version: "2024-09"
    notes: "Práctica guiada con comandos mongosh resueltos; solo la 'Práctica adicional' (clima) queda propuesta."
  - match: "material teorico/unidad 4*/instalacion mongodb.pdf"
    doc_type: instructivo
    version: "2023-08"
    extraction: skip
    notes: "Contiene una credencial de Atlas en texto plano (p. 6): no extraer ni transcribir sin redactarla. Poco texto; el portal ya tiene instalacion-mongodb."
  - match: "material teorico/unidad 5*/unidad-5_1.pdf"
    version: "v1.1 (2025-06)"
    notes: "Única presentación de cátedra de u5. Ningún documento de cátedra en raw/ cubre u6."

  # ---------------------------------------------------------------------------------------------
  # Apuntes de alumnos. "Recomendado" en el nombre no implica aval de la cátedra.
  - match: "apuntes/*"
    doc_type: apunte-alumno
    source: Apunte de alumno (autoría en el documento; no es material de cátedra)
    license: privado-alumno
  - match: "apuntes/1. apunte - recomendado.pdf"
    units: [u1, u2, u3, u4]
    version: "1C2025"
    notes: "Resumen de terceros (el título de metadatos dice 'no es mío'). Página de Notion impresa y escaneada: requiere OCR; hay código recortado en el margen."
  - match: "apuntes/2. apunte - recomendado.pdf"
    units: [u1, u2, u3, u4]
    version: "2C2025"
    notes: "Rotula la u4 como 'Transacciones y rendimiento', pero su contenido es NoSQL."
  - match: "apuntes/3. apunte - recomendado.pdf"
    units: [u1, u2, u3, u4]
    version: "2C2025"
  - match: "apuntes/4. apunte.pdf"
    units: [u1, u2, u3, u4, u5, u6]
    version: "2025"
    extraction: {profile: text, force_ocr: true, picture_text: true}
    notes: "Clases 1-7 y 10-12 (faltan 8 y 9). La capa de texto está rota (mojibake con pypdfium2; 67 % de U+FFFD con Docling): se fuerza OCR de página completa."
  - match: "apuntes/5. apunte/unidad 4.docx"
    units: [u4, u5, u6]
    version: "2C2023"
    notes: "Acumulativo: párrafos 0-94 son u4 (conceptual, sin MQL); 95-305 repiten completo 'UNIDAD 5.docx' (u5); desde el 306, una versión previa de 'Unidad 6.docx' (u6, 67 de sus 102 párrafos)."
  - match: "apuntes/5. apunte/unidad 5.docx"
    units: [u5]
    version: "2C2023"
  - match: "apuntes/5. apunte/unidad 6.docx"
    units: [u6]
    version: "2C2023"
    notes: "Ley 25.326, GDPR, ISO/IEC 25012; cierra con un bloque de DENY y herencia de permisos (u5)."
  - match: "apuntes/6. apunte.docx"
    units: [u1, u2, u3]
    version: "2C2023"
  - match: "apuntes/10. apunte.pdf"
    doc_type: resolucion-alumno
    units: [u1, u2, u3, u4, u5]
    notes: "No es un apunte: preguntas situacionales de práctica para el parcial con respuestas del autor, no validadas."
  - match: "apuntes/7. apunte.txt"
    doc_type: enlace-externo
    source: Enlace a una página de Notion de autoría desconocida
    units: []
    extraction: skip
    notes: "Solo contiene una URL de Notion; no se sigue. Si interesa, descargar la página a mano y agregarla a raw/."
  - match: "apuntes/base de datos aplicada.pdf"
    units: [u1, u2, u3, u4]
    version: "1C2026"
  - match: "apuntes/bases de datos aplicadas.pdf"
    units: [u1, u2, u3, u4]
    version: "1C2026"

  # ---------------------------------------------------------------------------------------------
  # Resoluciones de alumnos de las guías de cátedra.
  - match: "ejercicios resueltos/*"
    doc_type: resolucion-alumno
    source: Resolución de alumno (sin validar por la cátedra)
    license: privado-alumno
  - match: "ejercicios resueltos/*/resolucion mongo.pdf"
    units: [u4]
    notes: "Resuelve 'Guia  de Ejercicio 2' (datosventas). El ejercicio 8 enuncia 'Morón' y filtra 'Haedo'."
  - match: "ejercicios resueltos/*/resolucion wf.pdf"
    units: [u1]
    notes: "Resuelve la guía de window functions v1.0 (2024-03)."

  # ---------------------------------------------------------------------------------------------
  # "Formularios" son autoevaluaciones de MS Forms (preguntas de cátedra, intento de un alumno).
  - match: "formularios/*"
    doc_type: autoevaluacion
    source: Autoevaluación de cátedra (MS Forms), intento de alumno
    license: privado-alumno
  - match: "formularios/1. formulario.pdf"
    units: [u1]
    extraction: skip
    notes: "Capturas sin responder de la Autoevaluación 1; las mismas preguntas están con texto en 'DB# - Autoevaluación 1.pdf'."
  - match: "formularios/2. formulario.pdf"
    units: [u2]
    extraction: {profile: text, force_ocr: true, picture_text: true}
    notes: "Única copia de la Autoevaluación 2. Capturas escaneadas: requiere OCR; marca la opción correcta."
  - match: "formularios/3. formulario.pdf"
    units: [u3]
    extraction: {profile: text, force_ocr: true, picture_text: true}
    notes: "Otro intento de la Autoevaluación 3 (capturas escaneadas: requiere OCR); a diferencia del PDF con texto, muestra la opción elegida y la correcta."
  - match: "formularios/*autoevaluacion 3.pdf"
    units: [u3]
    version: "2C2024"
    notes: "Solo indica correcto/incorrecto por pregunta. Contiene el DNI del alumno."
  - match: "formularios/*autoevaluacion 4.pdf"
    units: [u4]
    version: "2C2024"
    notes: "Solo indica correcto/incorrecto por pregunta. Contiene el DNI del alumno."
  - match: "formularios/db* - autoevaluacion 1.pdf"
    units: [u1]
    version: "2C2024"
    notes: "Solo indica correcto/incorrecto por pregunta. Contiene el DNI del alumno."

  # ---------------------------------------------------------------------------------------------
  # Exámenes "filtrados": fotos de exámenes resueltos y reconstrucciones de memoria de alumnos.
  # Comisiones: 5600 = viernes tarde, 2900 = martes noche. El primer parcial evalúa u1-u4.
  - match: "parciales filtrados/*"
    doc_type: parcial
    source: Examen reconstruido o resuelto por alumnos (no oficial)
    license: privado-alumno
    units: [u1, u2, u3, u4]
  - match: "parciales filtrados/parcial/1. *"
    units: [u1, u2, u3]
    version: "1C2024, Tema 3 (10/05/2024), com. 5600"
    notes: "Foto del enunciado impreso con resolución manuscrita de alumno corregida (nota 7). Mismo examen que '4. …' (otro tema). Datos personales visibles."
  - match: "parciales filtrados/parcial/2. *"
    units: [u1, u2, u3]
    version: "2C2023 (26/09/2023), com. 2900"
    notes: "Foto del enunciado con resolución manuscrita desaprobada; páginas desordenadas (1, 3, 2, 4). El nombre del docente no consta en el documento."
  - match: "parciales filtrados/parcial/3. *"
    units: [u1, u3, u4]
    version: "2C2024, Tema 3 (18/10/2024), com. 5600"
    notes: "Foto del enunciado con resolución manuscrita con errores marcados. Mismo enunciado que el primer bloque de 'Recopilado/Parciales base de datos.docx'. Datos personales visibles."
  - match: "parciales filtrados/parcial/4. *"
    units: [u1, u3]
    version: "1C2024, Tema 4 (10/05/2024), com. 5600"
    notes: "Foto de baja resolución con resolución manuscrita (nota 7); falta la consigna 5. Mismo examen que '1. …' (otro tema)."
  - match: "parciales filtrados/parcial/5. *"
    units: [u1, u3, u4]
    version: "2C2025, Tema 3, com. 5600"
    notes: "Reconstrucción de memoria de un alumno; no es un enunciado oficial."
  - match: "parciales filtrados/parcial/6. *"
    units: [u1, u3, u4]
    version: "2C2025, Tema 1, com. 2900"
    notes: "Reconstrucción de memoria de un alumno. El docente del nombre no consta en el texto."
  - match: "parciales filtrados/parcial/7. *"
    units: [u1, u3, u4]
    version: "1C2025, recuperatorio, com. 5600"
    notes: "Reconstrucción de memoria de un alumno; casi literal en el segundo bloque de 'Recopilado/Parciales base de datos.docx'."
  - match: "parciales filtrados/parcial/8. *"
    units: [u1, u2, u4]
    version: "2C2025, recuperatorio, com. 2900"
    notes: "Reconstrucción de alumno. El nombre no indica que es un recuperatorio."
  - match: "parciales filtrados/parcial/9. *"
    units: [u1, u3, u4]
    version: "1C2026"
    notes: "Reconstrucción de alumno; no consta si es parcial, recuperatorio o simulacro, ni la comisión."
  - match: "parciales filtrados/parcial/10. *"
    version: "2C2026, primer parcial, com. 5600"
    notes: "Reconstrucción de alumno de la cursada en curso, con errores de transcripción en las consultas."
  - match: "parciales filtrados/final/*"
    doc_type: final
    units: [u1, u3, u4, u5, u6]
  - match: "parciales filtrados/final/1. *"
    version: "1C2025, llamado B"
    notes: "Reconstrucción de memoria de un alumno; no es un enunciado oficial."
  - match: "parciales filtrados/final/2. *"
    version: "2C2025, extraordinario (22/10/2025)"
    notes: "Reconstrucción de memoria de un alumno. El nombre dice 'Llamado C'; el texto, 'extraordinario'."
  - match: "parciales filtrados/final/3. *"
    version: "2C2025, mesa A (12/12/2025)"
    notes: "Reconstrucción de memoria de un alumno; no es un enunciado oficial."
  - match: "parciales filtrados/recopilado/*"
    doc_type: recopilacion-examenes
    units: [u1, u3, u4]
    notes: "Tres bloques con respuestas de alumno: 2C2024 Tema 3 (repite 'Parcial/3. …'), recuperatorio 1C2025 com. 5600 (repite 'Parcial/7. ….txt') y uno sin rótulo. Errores de transcripción (salario 60000 por 62000)."

# Motores para verificar ejemplos y resoluciones (content-pipeline verify-code; content-guide §7).
# Imágenes fijadas por digest para que las pruebas sean reproducibles. Los contenedores no publican
# puertos; la contraseña de SQL Server se genera al crearlos y no se guarda en el repositorio.
engines:
  mssql:
    image: mcr.microsoft.com/mssql/server@sha256:4525e3efac9f3e241cb003bb2ff2a82818b502f37e12049d788b1a9fa7e13b7f
    tag: 2022-latest (2026-11-05)
    platform: linux/amd64
    container: bbdda-mssql
  mongo:
    image: mongo@sha256:884c055bff8b7144ca44830d01826facd3083b33c4dea44b94a1476c62de3c32
    tag: "7.0"   # digest de la lista de manifiestos (multiarquitectura)
    container: bbdda-mongo

