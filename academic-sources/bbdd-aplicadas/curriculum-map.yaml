    differences:
    - u1 (2023) incluía 'Formatos de intercambio (XML, JSON, YAML, CSV, etc.)'; en 2024 pasan a u2.
    - u2 (2024) agrega 'Qué es una API'.
    - 'Títulos: 2023 ''Bases de datos transaccionales'' (u2, u3) y ''no transaccionales'' (u4); 2024 ''relacionales''
      y ''no relacionales''.'
    - 'u3, u4 (incluidos Data Mining y KDD), u5 y u6: mismo contenido; solo cambia el título de u3 y u4.'
    - 'Evaluación: 2023 dos parciales (u1–u3, u4–u6); 2024 un parcial (u1–u4) y TP integrador.'
    - Contenidos mínimos idénticos (incluyen KDD y Data Warehousing).
decisions:
- id: D1
  date: '2026-11-17'
  text: Programa 2024 (3641) como referencia principal provisional; 2023 como antecedente. No inventar una actualización
    2025/2026.
- id: D2
  date: '2026-11-17'
  text: No incorporar nuevas reproducciones de enunciados de cátedra sin autorización; auditar los publicados y
    proponer reemplazos originales.
- id: D3
  date: '2026-11-17'
  text: Unidad 6 sustentada en fuentes primarias oficiales (InfoLEG, EUR-Lex, información pública de ISO/IEC 25012).
    Sin material protegido ni atribuciones no verificadas.
- id: D4
  date: '2026-11-17'
  text: POO limitado a correspondencia objeto-relacional/documental, ORM y ODM. KDD con las cinco etapas de Fayyad.
- id: D5
  date: '2026-11-17'
  text: Reubicar contenidos fuera de unidad; conservar complementarios útiles rotulados; no eliminar contenido correcto
    sin justificar.
- id: D6
  date: '2026-11-17'
  text: Pruebas reproducibles con SQL Server 2022 y MongoDB 7; registrar por separado ejecutados, revisados sin
    ejecución y pendientes.
- id: D7
  date: '2026-11-17'
  text: QA distingue operadores MongoDB de fórmulas; SQL propio en singular + PascalCase; mínimos por unidad con
    resoluciones completas, sin relleno.
- id: D8
  date: '2026-11-17'
  text: Retirada de los PDF públicos como corrección de seguridad independiente, sin desplegar sin autorización;
    la titular debe rotar la credencial expuesta.
minimums:
  exercises_per_unit: 6
  levels_per_unit: 2
  notes: Piso global; cada unidad declara minimum_exercises y minimum_per_level. Solo cuentan ejercicios con resolución
    completa (content-guide §8).
