# Matriz de cobertura curricular — Bases de Datos Aplicada (3641).
# Referencia PROVISIONAL: programa analítico 2024 (bbdd-aplicadas-3d9721081e14). El programa público 2023
# se registra en program.historical; sus esquemas de evaluación no se mezclan.
# sources: fuentes de cátedra con páginas del PDF. student_sources: material de alumnos (no verificado).
