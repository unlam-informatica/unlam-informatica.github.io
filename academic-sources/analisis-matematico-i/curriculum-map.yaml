    coverage_after: completo
  - id: u2-limite-finito
    title: Límite finito, definición e interpretación gráfica
    program_text: Límite finito. Definición. Interpretación gráfica.
    objectives:
    - Enunciar e interpretar gráficamente la definición ε-δ de límite finito.
    - Probar con la definición límites de funciones lineales y cuadráticas sencillas, hallando δ en función de ε.
    prerequisites: [u2-entorno]
