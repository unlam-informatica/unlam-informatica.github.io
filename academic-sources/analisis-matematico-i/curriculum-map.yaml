  - id: u1-paridad
    title: Funciones par e impar
    program_text: Funciones par e impar.
    objectives:
    - Clasificar una función en par, impar o ninguna de las dos con la definición, verificando que el dominio sea simétrico.
    - Relacionar la paridad con la simetría del gráfico.
