  - id: u1-elementales
    title: Funciones algebraicas y trascendentes, gráficos y características
    program_text: Funciones algebraicas y trascendentes, sus gráficos y características principales.
    objectives:
    - Reconocer y graficar las funciones lineal, cuadrática, polinómica, racional (homográfica), irracional, valor absoluto y por tramos.
    - Reconocer y graficar exponenciales, logarítmicas, trigonométricas y trigonométricas inversas, con dominio, imagen, ceros, período y asíntotas.
