    guide_exercises: [P1.2, P1.3, P1.4, P1.5, P1.6, P1.7, P1.8, P1.12, P1.18, P1.19, P1.21, P1.24, P1.25, P1.27, P1.28, P1.29, P1.30, P1.31]
    portal_pages:
