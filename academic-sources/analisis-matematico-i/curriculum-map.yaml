# Matriz curricular — Análisis Matemático I (Ingeniería en Informática, código 3622).
# Referencia: programa analítico de las «Consideraciones generales 2C2026» (analisis-matematico-i-5ccac17bb05e),
# la versión más reciente acreditada. Coincide con las cuatro unidades que ya tenía el portal; no hay versiones
# anteriores del programa entre las fuentes locales para contrastar.
#
# sources: fuentes de cátedra con páginas del PDF. guide_exercises: ejercicios de la Guía de TP 2026
#   (P<n>.<k>; «A» = adicional). portal_pages: páginas que ya existían en el portal (URL conservadas).
# page: lección donde el tema se desarrolla (nueva en la etapa D). exercises: ejercicios originales con
#   resolución (identificadores U<n>.<kk>, únicos en la materia).
# audit: estado de las páginas existentes (detalle en reports/content-audit.md).
# production: pendiente | en-redaccion | redactado | revisado
# validation: pendiente | verificado | revisado | con-observaciones
subject: analisis-matematico-i
program:
  code: '3622'
  shared_codes: ['4122', '3681', '4052']
  year: 2026
  term: 2C2026
  status: vigente
  document: analisis-matematico-i-5ccac17bb05e
  hours_per_week: 4
  axes:
  - Las funciones como modelos.
  - El límite como base del concepto de derivada y de comportamiento asintótico de curvas.
  - La derivada como razón de cambio instantánea.
  - Aproximación de curvas.
  evaluation:
    parciales:
    - week: 8
      units: [u1, u2]
      notes: Cuatro ejercicios más el ítem de evaluaciones de seguimiento (ES 1 y ES 2); al menos un ejercicio con GeoGebra; formato mixto (desarrollo y opción múltiple).
    - week: 15
      units: [u3, u4]
      notes: Cuatro ejercicios más el ítem de evaluaciones de seguimiento (ES 3 y ES 4); formato mixto.
    recuperatorio:
      week: 16
      notes: Se puede recuperar un parcial; la nota del recuperatorio reemplaza a la del parcial.
    promocion: Ambos parciales con 7 o más.
    final: Cursada (4 a 6) → examen final, mayoritariamente de opción múltiple. Libre → todos los temas, teoría, práctica y GeoGebra.
  methodology_notes:
  - En 2C2026 el tema Continuidad se estudia de manera autónoma con una guía de la cátedra (analisis-matematico-i-315ad3f8bf01) y se evalúa en el primer parcial.
decisions:
- id: D1
  date: '2026-11-20'
  text: El programa de las Consideraciones generales 2C2026 es la referencia curricular. Las cuatro unidades del portal coinciden con él.
- id: D2
  date: '2026-11-20'
  text: Las páginas de práctica existentes reproducen enunciados de la Guía de TP 2026 con resoluciones propias. Se conservan con atribución y se auditan contra las respuestas oficiales de la guía; no se agregan reproducciones nuevas sin autorización. Los ejercicios nuevos son originales.
- id: D3
  date: '2026-11-20'
  text: Las páginas de teoría existentes (una por unidad) se conservan íntegras como resumen integrador; el desarrollo se hace en lecciones por bloque temático, con URL nuevas.
- id: D4
  date: '2026-11-20'
  text: Diferencial (apunte de la Unidad 3) y los teoremas de funciones continuas que el apunte marca como optativos (Bolzano, valor intermedio, Weierstrass) no figuran literalmente en el programa 2026. El diferencial se presenta como complementario; los teoremas se incluyen dentro de «Propiedades de las funciones continuas», que sí figura, enunciados sin demostración formal.
- id: D5
  date: '2026-11-20'
  text: La razón de cambio media se introduce en la Unidad 1 como herramienta de modelado (la guía la usa en P1.2–P1.4) y se formaliza en la Unidad 3, donde la ubica el programa.
minimums:
  exercises_per_unit: 12
  levels_per_unit: 3
  notes: Solo cuentan ejercicios originales con resolución completa. No se agregan ejercicios de relleno.
