units:
- id: u1
  title: Funciones
  exercise_prefix: U1.
  minimum_exercises: 12
  minimum_per_level: 3
  prerequisites:
  # Contenidos de matemática previos a la materia (no hay fuente de la cátedra entre las locales que los liste).
  - Números reales, intervalos y valor absoluto.
  - Expresiones algebraicas, factorización y racionalización.
  - Ecuaciones e inecuaciones.
  - Noción de función.
  topics:
  - id: u1-funcion
    title: Definición de función, dominio, imagen y registros de representación
    program_text: Definición de función. Dominio. Imagen. Representación de funciones en diferentes registros.
    objectives:
    - Reconocer cuándo una relación entre conjuntos de números reales es una función y expresarla como terna (dominio, codominio, ley).
    - Determinar dominio e imagen a partir de la fórmula, del gráfico o de una tabla.
    - Pasar entre los registros verbal, tabular, gráfico y algebraico.
    prerequisites: [previo-reales, previo-funcion]
    sources:
    - {doc: analisis-matematico-i-cf66ddbbbcbd, pages: [1, 2, 3]}
    guide_exercises: [P1.1, P1.10, P1.20]
    portal_pages:
    - /analisis-matematico-i/unidad-1/teoria/unidad-1/
    - /analisis-matematico-i/unidad-1/practica/ejercicio-1/
    - /analisis-matematico-i/unidad-1/practica/ejercicio-10/
    page: /analisis-matematico-i/unidad-1/teoria/funciones-y-modelos/
    exercises: [U1.01, U1.02, U1.03, U1.04, U1.05]
    production: redactado
    validation: verificado
    audit: {coverage: completo, quality: media, action: ampliar}
    coverage_after: completo
  - id: u1-modelos
    title: Las funciones como modelos
    program_text: Las funciones como modelos.
    objectives:
    - Identificar variables, unidades y dominio en contexto al modelar un problema.
    - Construir modelos lineales, cuadráticos, exponenciales y periódicos a partir de datos o de una descripción.
    - Calcular e interpretar la razón de cambio media de un modelo en un intervalo.
    prerequisites: [u1-funcion]
    sources:
