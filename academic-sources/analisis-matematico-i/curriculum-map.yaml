- id: u2
  title: Límite funcional y continuidad
  exercise_prefix: U2.
  minimum_exercises: 15
  minimum_per_level: 4
  prerequisites:
  - Unidad 1 completa, en particular funciones elementales, dominio y valor absoluto.
  - Factorización, racionalización y desigualdades con valor absoluto.
  topics:
  - id: u2-entorno
    title: Distancia, entorno y entorno reducido
    program_text: Distancia entre dos números reales. Entorno y entorno reducido.
    objectives:
    - Escribir entornos y entornos reducidos como intervalos y como desigualdades con valor absoluto.
    prerequisites: [previo-reales]
