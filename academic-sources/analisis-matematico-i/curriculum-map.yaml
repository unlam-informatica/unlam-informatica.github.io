  - id: u2-laterales-propiedades
    title: Límites laterales, unicidad, propiedades y teorema de intercalación
    program_text: Límites laterales. Unicidad del límite. Propiedades del límite. Teorema de intercalación.
    objectives:
    - Calcular límites laterales y decidir la existencia del límite (funciones por tramos, valor absoluto).
    - Aplicar el álgebra de límites indicando sus hipótesis.
    - Aplicar el teorema de intercalación (incluido el producto de un infinitésimo por una función acotada).
