    coverage_after: completo
  - id: u1-ceros-signo
    title: Ceros y signo de una función
    program_text: Ceros. Signo de una función.
    objectives:
    - Calcular ceros y conjuntos de positividad y negatividad de funciones polinómicas, racionales y por tramos.
    - Justificar el signo en cada intervalo (teorema de Bolzano informal o tabla de signos con factorización).
