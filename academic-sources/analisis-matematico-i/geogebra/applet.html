<!doctype html><html><head><meta charset="utf-8"><script src="https://www.geogebra.org/apps/deployggb.js"></script></head>
<body><div id="ggb"></div><script>
window.ready=false;
const p=new GGBApplet({appName:"classic",width:900,height:600,language:"es",showAlgebraInput:true,
  appletOnLoad:function(api){window.api=api;window.ready=true;}},true);
window.addEventListener("load",()=>p.inject("ggb"));
</script></body></html>
